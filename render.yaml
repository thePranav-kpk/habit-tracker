services:
  # 1. Backend Web Service on Render (Node.js)
  - type: web
    name: atomic-habits-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: NTFY_TOPIC
        value: atomic-habits-pranav
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:admin@atomic-habits.local
      - key: FRONTEND_URL
        sync: false

  # 2. Frontend Static Site on Render (Vite React SPA)
  - type: web
    name: atomic-habits-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
